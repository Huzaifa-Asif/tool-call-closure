name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide a minimal example with synthetic data only.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    attributes:
      label: Versions
      description: Package and Node.js versions
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: I removed credentials and private tool output.
          required: true
